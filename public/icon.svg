<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none" role="img">
  <title>Fulbito SB5</title>
  <defs>
    <radialGradient id="shine" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#93facc"/>
      <stop offset="42%" stop-color="#45d698"/>
      <stop offset="100%" stop-color="#0f5c45"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Fondo: tono cercano al theme oscuro del sitio -->
  <rect width="180" height="180" rx="40" fill="#061018"/>
  <!-- Halo verde (glass / neon del sitio) -->
  <circle cx="90" cy="93" r="71" opacity="0.28" stroke="#45d698" stroke-width="1.75" fill="none"/>
  <!-- Pelota -->
  <circle cx="90" cy="93" r="58" fill="url(#shine)" filter="url(#glow)"/>
  <!-- Pentágono central (patrón clásico, legible en 16–32px) -->
  <path
    fill="#f7fffb"
    fill-opacity=".96"
    stroke="#065f46"
    stroke-width="1.35"
    stroke-linejoin="round"
    d="M90 71 110.92 86.2 102.94 110.79 77.06 110.79 69.08 86.2z"
  />
  <!-- Aristas sutiles tipo panel -->
  <g stroke="#0f6b54" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M90 71 l-15.3 11.05 M90 71 l15.3 11.05"/>
    <path d="M76.95 111.2l-6.2-31.65"/>
    <path d="M103.05 111.2l6.2-31.65"/>
  </g>
</svg>
