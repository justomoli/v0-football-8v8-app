<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none" role="img">
  <title>Fulbito SB5 — pelota</title>
  <defs>
    <radialGradient id="sphere" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#bbffe4"/>
      <stop offset="38%" stop-color="#4bdc9a"/>
      <stop offset="72%" stop-color="#1a8462"/>
      <stop offset="100%" stop-color="#0d4f3f"/>
    </radialGradient>
    <linearGradient id="rimShade" x1="90" y1="150" x2="90" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000" stop-opacity="0.38"/>
      <stop offset="0.58" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="90" cy="93" r="56.5"/>
    </clipPath>
    <linearGradient id="panelA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eafff6"/>
      <stop offset="1" stop-color="#9be8c9"/>
    </linearGradient>
  </defs>
  <!-- Marco app -->
  <rect width="180" height="180" rx="40" fill="#051016"/>
  <circle cx="90" cy="93" r="71" opacity=".22" stroke="#40d694" stroke-width="1.5" fill="none"/>

  <!-- Pelota recortada -->
  <g clip-path="url(#ballClip)">
    <circle cx="90" cy="93" r="56.5" fill="url(#sphere)"/>
    <!-- 5 paneles tipo hex (entre pentágono y perímetro): patrón clásico legible también en tamaño ícono -->
    <path
      fill="url(#panelA)"
      opacity=".94"
      d="M90,36.5 A56.5,56.5 0 0 1 143.735,75.541 L112.825,85.584 L90,69 z"
    />
    <path
      fill="url(#panelA)"
      opacity=".94"
      d="M143.735,75.541 A56.5,56.5 0 0 1 123.21,138.709 L104.107,112.416 L112.825,85.584 z"
    />
    <path
      fill="url(#panelA)"
      opacity=".94"
      d="M123.21,138.709 A56.5,56.5 0 0 1 56.79,138.709 L75.893,112.416 L104.107,112.416 z"
    />
    <path
      fill="url(#panelA)"
      opacity=".94"
      d="M56.79,138.709 A56.5,56.5 0 0 1 36.265,75.541 L67.175,85.584 L75.893,112.416 z"
    />
    <path
      fill="url(#panelA)"
      opacity=".94"
      d="M36.265,75.541 A56.5,56.5 0 0 1 90,36.5 L90,69 L67.175,85.584 z"
    />
    <!-- Pentágono central (paneles oscuros típicos de una pelota Adidas/Telstar) -->
    <path
      fill="#083d31"
      stroke="#022b22"
      stroke-width="1"
      stroke-linejoin="round"
      d="M90,69 112.825,85.584 104.107,112.416 75.893,112.416 67.175,85.584 z"
    />
    <!-- Bisel interno muy fino sobre el pent -->
    <path
      fill="none"
      stroke="#1a9674"
      stroke-width="0.7"
      stroke-opacity=".42"
      stroke-linejoin="round"
      d="M90,69 112.825,85.584 104.107,112.416 75.893,112.416 67.175,85.584 z"
    />
    <!-- Brillo cenital -->
    <ellipse cx="74" cy="66" rx="28" ry="18" transform="rotate(-26 74 66)" fill="#fff" opacity=".24"/>
    <!-- Volumen inferior -->
    <circle cx="90" cy="93" r="56.5" fill="url(#rimShade)"/>
    <!-- Arista exterior del balón -->
    <circle cx="90" cy="93" r="56.2" fill="none" stroke="#01251d" stroke-width="1"/>
  </g>
</svg>
